*{box-sizing:border-box}body{margin:0;color:var(--text);font:15px system-ui;background:radial-gradient(ellipse at 0 0,#291443,transparent 38%),radial-gradient(ellipse at 100% 15%,#10303d,transparent 32%),var(--bg);min-height:100vh}.app{max-width:780px;margin:auto;padding:16px 14px 44px}header,.row{display:flex;align-items:center;gap:10px;justify-content:space-between}.brand{display:flex;align-items:center;gap:10px}.logo{display:grid;place-items:center;width:44px;height:44px;border-radius:14px;background:linear-gradient(135deg,var(--purple),var(--cyan));font-size:26px}h1{font-size:24px;letter-spacing:2px;margin:0}.sub,.muted,small{color:var(--muted);font-size:12px}nav{display:flex;gap:7px;overflow:auto;padding:20px 0 12px}button,input,select{font:inherit}

}

  background: #292943;

}

}

  color: #ff91a5;
}
h2{margin:5px 0;font-size:23px}h3{font-size:15px;margin:0 0 12px}.card{border:1px solid var(--border);border-radius:18px;background:linear-gradient(145deg,#19192d,#111120);padding:15px;margin:12px 0}.section{margin:20px 0}.grow{flex:1;min-width:0}.row.wrap{flex-wrap:wrap}
label{display:block;font-size:12px;color:#c1bed9;margin:12px 0}

input:not([type=range]):not([type=color]),

  color: var(--text);
  outline: none;
  transition: border-color 0.2s ease, box-shadow 0.2s ease, background 0.2s ease;
}

input:not([type=range]):not([type=color]):hover,
select:hover {
  border-color: #555474;
}

input:not([type=range]):not([type=color]):focus,
select:focus {
  border-color: var(--cyan);
  box-shadow: 0 0 0 3px #37dfeb20;
  background: #121222;
}
input[type=range]{width:100%;accent-color:var(--purple)}input[type=color]{width:48px;height:40px;padding:0;border:0;background:none}.hidden{display:none!important}.roomtabs{display:flex;gap:7px;overflow:auto;margin:15px 0}.device{position:relative}.device:before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:linear-gradient(var(--purple),var(--cyan))}.bulb{font-size:24px;background:#29203f;border-radius:12px;padding:8px}
.switch {

.switch span {

}

.switch.on {
  background: linear-gradient(90deg, var(--purple), var(--cyan));

}

.switch.on span {
  margin-left: 29px;
}
.online{color:#65e9b2}.offline{color:#ff8297}.notice{background:#17272a;border:1px solid #28535b;border-radius:12px;padding:12px;font-size:12px;color:#a7ecee;line-height:1.5}.status{font-size:12px;color:var(--muted);overflow-wrap:anywhere}.swatches{display:flex;gap:9px;flex-wrap:wrap}.swatch{width:35px;height:35px;border-radius:50%;border:2px solid #ffffff66;padding:0}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.effect{background:#0d0d1b;text-align:left}.empty{padding:25px;text-align:center;color:var(--muted)}hr{border:0;border-top:1px solid var(--border);margin:17px 0}@media(min-width:600px){.devices{display:grid;grid-template-columns:1fr 1fr;gap:10px}

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                }

/* GLOW NEON MOBILE REDESIGN */
:root {
  --bg: #05070d;
  --panel: #101522;
  --purple: #a855f7;
  --cyan: #35e7ff;
  --text: #f4f7ff;
  --muted: #939eb6;
  --border: #252e42;
}

body {
  background:
    radial-gradient(ellipse at 0% 0%, #261044 0%, transparent 42%),
    radial-gradient(ellipse at 100% 15%, #082b3a 0%, transparent 38%),
    #05070d;
  background-attachment: fixed;
}

.app {
  max-width: 780px;
  padding: 18px 15px 100px;
}

header { padding: 8px 0 14px; }

.logo {
  background: linear-gradient(135deg, #a855f7, #35e7ff);
  box-shadow: 0 0 24px #35e7ff30;
}

h1 { letter-spacing: 3px; font-weight: 850; }
h2 { font-size: 25px; letter-spacing: -.5px; }

nav {
  position: sticky;
  top: 0;
  z-index: 20;
  margin: 8px -15px 18px;
  padding: 12px 15px;
  background: #080b13ed;
  backdrop-filter: blur(18px);
  border-bottom: 1px solid #252e42;
  scrollbar-width: none;
}

nav button {
  flex: 0 0 auto;
  border-radius: 13px;
  background: #111725;
  border-color: #252e42;
  padding: 11px 14px;
}

nav button.active {
  color: #071018;
  background: linear-gradient(110deg, #35e7ff, #a855f7);
  border-color: transparent;
  font-weight: 750;
  box-shadow: 0 0 18px #35e7ff22;
}

.card {
  background: linear-gradient(145deg, #121a29, #0b101a);
  border: 1px solid #273248;
  border-radius: 21px;
  padding: 17px;
  box-shadow: 0 8px 28px #00000025;
}

.device { overflow: hidden; }

.device:before {
  width: 3px;
  box-shadow: 0 0 12px #35e7ff70;
}

.bulb {
  background: #17172b;
  box-shadow: inset 0 0 16px #a855f722;
}

button {
  min-height: 42px;
  border-radius: 13px;
  background: #151c2b;
  border-color: #2b354a;
  transition: border-color .15s, filter .15s;
}

button.primary {
  color: #071018;
  background: linear-gradient(110deg, #35e7ff, #a855f7);
  font-weight: 750;
}


button.danger {
  min-width: 150px;
  min-height: 58px;
  padding: 15px 22px;
  border: 1px solid #a8325c;
  border-radius: 17px;
  background: linear-gradient(135deg, #351323, #21101d);
  color: #ff91b0;
  font-size: 17px;
  font-weight: 750;
  box-shadow: 0 0 18px #ff397a20;

}

input:not([type=range]):not([type=color]),
select {
  background: #080d17;
  border-color: #2b354a;
  border-radius: 13px;
  min-height: 45px;
}

input[type=range] {
  accent-color: #35e7ff;
  min-height: 30px;
}

input[type=color] {
  border-radius: 12px;
  overflow: hidden;
}

.swatch {
  width: 39px;
  height: 39px;
  border: 2px solid #ffffff45;
  box-shadow: 0 2px 10px #00000040;
}

.switch.on { box-shadow: 0 0 15px #35e7ff45; }

.notice {
  background: #0c2028;
  border-color: #1d5864;
  border-radius: 15px;
}

.status, .sub { letter-spacing: .1px; }

.empty {
  border: 1px dashed #303b52;
  border-radius: 17px;
  margin: 12px 0;
}

@media (max-width: 599px) {
  .app { padding-left: 13px; padding-right: 13px; }
  header { align-items: center; }
  h1 { font-size: 23px; }
  nav {
    margin-left: -13px;
    margin-right: -13px;
    padding-left: 13px;
    padding-right: 13px;
  }
  #home > .row:first-child { align-items: flex-start; }
  #home > .row:first-child h2 { font-size: 23px; }
  .card { padding: 15px; margin: 11px 0; }
  .grid {
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 9px;
  }
  button { min-height: 44px; }
}

.device {

  display: none !important;
}

.device:before {

}

.device button {

}

.device .switch {

}

.device h3 {

@media (max-width: 599px) {

  }

/* GLOW DASHBOARD UPGRADE */
.device {

}

  align-items: center;

}

}
@media (max-width: 599px) {

/* GLOW NEON FINISH */
.device {
  border: 1px solid #51417b !important;
  background: linear-gradient(145deg, #1a2036, #0b1220) !important;
  box-shadow:
    0 0 0 1px #a855f715,
    0 8px 28px #00000055,

  content: "" !important;

  border: 1px solid #8b5cf6aa !important;

/* GLOW CONTROL POLISH */
input[type="range"] {
  width: 100% !important;
  min-height: 34px !important;
  accent-color: #35e7ff !important;
  cursor: pointer;
}

}

  }

  }

/* GLOW COLOUR STUDIO */
.wheel-layout {
  display: flex;
  align-items: center;
  gap: 18px;
  flex-wrap: wrap;
  margin: 14px 0 20px;
}

  width: 240px;
  height: 240px;
  max-width: 100%;
  flex-shrink: 0;
  padding: 5px;

}

  width: 100% !important;

<body><div class="app">
<header><div class="brand"><div class="logo" role="button" tabindex="0"
  title="Back to Glow home"
  onclick="page('home')"
  onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();page('home')}">

<svg viewBox="0 0 48 48" width="44" height="44"
     aria-hidden="true" style="overflow:visible">
  <defs>
    <linearGradient id="houseNeon" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ff65f5"/>
      <stop offset="48%" stop-color="#a855ff"/>
      <stop offset="100%" stop-color="#00eaff"/>
    </linearGradient>
    <filter id="houseGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="3.2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="bulbGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="1.4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <path d="M7 21.5 24 7 41 21.5 V39 Q41 42 38 42 H10 Q7 42 7 39 Z"
        fill="#10152b" stroke="url(#houseNeon)"
        stroke-width="4.5" stroke-linejoin="round"
        filter="url(#houseGlow)"/>

  <path d="M24 17
           C18.8 17 16 21 17.5 25.5
           C18.2 27.5 20 29 20.5 31
           H27.5 C28 29 29.8 27.5 30.5 25.5
           C32 21 29.2 17 24 17 Z"
        fill="#d8ffff" filter="url(#bulbGlow)"/>

  <path d="M21 33 H27 M21.8 36 H26.2"
        stroke="#00eaff" stroke-width="2.5"
        stroke-linecap="round"/>
  <path d="M22.5 39 H25.5"
        stroke="#ff65f5" stroke-width="2"
        stroke-linecap="round"/>
</svg>

</div><div><h1>GLOW</h1><div class="sub">YOUR LIGHTS. YOUR CONTROL. YOUR STYLE.</div></div></div><span class="sub" id="topStatus">● Ready</span></header>
<nav id="nav" class="hidden"></nav>
<section id="home">
  <div class="card" style="text-align:center;padding:30px 20px">
    <div style="font-size:48px;margin-bottom:12px">✦</div>
    <h2>Welcome to Glow</h2>
    <p class="sub">Your lights. Your control. Your style.</p>

    <button class="primary" style="width:100%;margin:12px 0"
      onclick="page('devices');clearForm()">
      ☷ View Devices
    </button>

   
<button style="width:100%;margin:6px 0"
  onclick="showAddDevice()">
  ＋ Add Device
</button>
  </div>
</section>

<section id="controls" class="hidden">
  <h2>Light controls</h2>

  <label>
    Selected device
    <select id="cdev" onchange="selected=this.value;renderControls()"></select>
  </label>

  <label>
    Dashboard section
    <select id="dashboardSection" onchange="page(this.value)">
      <option value="controls">Colours</option>
      <option value="effects">Effects &amp; Palettes</option>
     
      <option value="presets">Saved Presets</option>
    </select>
  </label>

  <div id="controlBody"></div>
</section>
<section id="effects" class="hidden">
  <h2>Effects & palettes</h2>

  
<label>
  Selected device
  <select id="edev" onchange="selected=this.value;loadEffects()"></select>
</label>

<label>
  Dashboard section
  <select onchange="page(this.value)">
    <option value="controls">Colours</option>
    <option value="effects" selected>Effects &amp; Palettes</option>
    <option value="presets">Saved Presets</option>
  </select>
</label>
<div class="card"><h3>Effects</h3><input id="effectSearch" placeholder="Search effects" oninput="renderEffects()"><div id="effectGrid" class="grid"></div><hr><h3>Palette</h3><select id="palette" onchange="setSeg({pal:+this.value})"></select><label>Speed <span id="speedN">128</span><input id="speed" type="range" min="0" max="255" value="128" oninput="speedN.textContent=this.value" onchange="setSeg({sx:+this.value})"></label><label>Intensity <span id="intensityN">128</span><input id="intensity" type="range" min="0" max="255" value="128" oninput="intensityN.textContent=this.value" onchange="setSeg({ix:+this.value})"></label></div><div id="effectStatus" class="status"></div></section>
<section id="patterns" class="hidden"><h2>Custom patterns</h2><label>Selected device<select id="pdev" onchange="selected=this.value"></select></label><div class="card"><div class="grid"><label>Starting LED<input id="pstart" type="number" min="0" value="0"></label><label>LED count<input id="plen" type="number" min="1" value="30"></label></div>
<h3>Choose colours</h3>

<div class="wheel-layout" style="display:flex;flex-direction:column;align-items:center;gap:16px">
  <div class="wheel-wrap" style="width:100%;display:flex;justify-content:center">
    <canvas id="colourCanvas" width="240" height="240"
      role="slider" tabindex="0"
      aria-label="Rainbow colour wheel"
      style="display:block;max-width:100%;height:auto">
    </canvas>
  </div>

  <div class="wheel-details" style="width:100%">
    <label>Selected colour
      <input id="wheelHex" type="text" value="#ff4b70"
        maxlength="7" oninput="setHexColour(this.value)">
    </label>
    <input type="hidden" id="wheelTarget" value="0">

async function command(body){let d=dev();if(!d)return;try{await api(d,"/json/state","POST",body);if($("controlStatus"))$("controlStatus").textContent="Updated"}catch(e){if($("controlStatus"))$("controlStatus").textContent="Could not send command. Check connection."}}
function applyColour(h){if(!/^#[0-9a-f]{6}$/i.test(h))return alert("Enter a colour like #ff55aa");let rgb=[1,3,5].map(i=>parseInt(h.slice(i,i+2),16));if($("colour"))$("colour").value=h;if($("hex"))$("hex").value=h;command({seg:{col:[rgb]}})}
async function loadEffects(){renderSelects();let d=dev($("edev").value||selected);if(!d)return;selected=d.id;$("effectGrid").textContent="Loading…";try{effects=await api(d,"/json/effects");palettes=await api(d,"/json/palettes");$("palette").innerHTML=palettes.map((p,i)=>`<option value="${i}">${esc(p)}</option>`).join("");renderEffects();$("effectStatus").textContent=effects.length+" effects and "+palettes.length+" palettes loaded."}catch(e){$("effectGrid").textContent="Could not load effects. Check connection.";$("effectStatus").textContent="WLED API unavailable."}}
function renderEffects(){let q=$("effectSearch").value.toLowerCase();$("effectGrid").innerHTML=effects.map((n,i)=>({n,i})).filter(x=>String(x.n).toLowerCase().includes(q)).map(x=>`<button class="effect" onclick="setSeg({fx:${x.i}})">${esc(x.n)}</button>`).join("")||"No matching effects."}

function syncWheelColour(){

function setWheelColour(value){
  if(!/^#[0-9a-fA-F]{6}$/.test(value))return;

  const target=$("wheelTarget");
  const i=target?Number(target.value):0;

  if(!Number.isInteger(i)||i<0||i>=colours.length)return;

  colours[i]=value;

  if($("wheelHex"))$("wheelHex").value=value;
  if($("colour"))$("colour").value=value;
  if($("hex"))$("hex").value=value;

  const container=$("colours");
  if(container){
    const swatches=container.querySelectorAll(".colour-swatch");
    if(swatches[i]){
      swatches[i].style.backgroundColor=value;
      swatches[i].style.boxShadow="0 0 10px "+value+"66";
    }
  }

  if($("colourCanvas"))drawColourWheel();

  const rgb=[
    parseInt(value.slice(1,3),16),
    parseInt(value.slice(3,5),16),
    parseInt(value.slice(5,7),16)
  ];

  command({seg:{col:[rgb]}});
}
function setHexColour(value){
  if(/^#[0-9a-fA-F]{6}$/.test(value)){
    const i=+$("wheelTarget").value;
    colours[i]=value;
    if($("wheelHex"))$("wheelHex").value=value;
    renderColours();
    if($("colourCanvas"))drawColourWheel();
  }
}

function drawColourWheel(){
  const canvas=$("colourCanvas");
  if(!canvas)return;
  const ctx=canvas.getContext("2d");
  if(!ctx)return;
  const size=canvas.width;
  const centre=size/2;
  const radius=size/2-3;
  const image=ctx.createImageData(size,size);
  for(let y=0;y<size;y++){
    for(let x=0;x<size;x++){
      const dx=x-centre;
      const dy=y-centre;
      const distance=Math.sqrt(dx*dx+dy*dy);
      const index=(y*size+x)*4;
      if(distance<=radius){
        let hue=(Math.atan2(dy,dx)*180/Math.PI+360)%360;
        const saturation=Math.min(1,distance/(radius*0.78));
        const value=1;
        const chroma=value*saturation;
        const h=hue/60;
        const second=chroma*(1-Math.abs(h%2-1));
        let r=0,g=0,b=0;
        if(h<1){r=chroma;g=second}
        else if(h<2){r=second;g=chroma}
        else if(h<3){g=chroma;b=second}
        else if(h<4){g=second;b=chroma}
        else if(h<5){r=second;b=chroma}
        else{r=chroma;b=second}
        const m=value-chroma;
        image.data[index]=Math.round((r+m)*255);
        image.data[index+1]=Math.round((g+m)*255);
        image.data[index+2]=Math.round((b+m)*255);
        image.data[index+3]=255;
      }else{
        image.data[index+3]=0;
      }
    }
  }
  ctx.clearRect(0,0,size,size);
  ctx.putImageData(image,0,0);
  const i=+$("wheelTarget").value;
  const colour=colours[i]||"#ff4b70";
  const rgb=colour.match(/[0-9a-f]{2}/gi);
  if(!rgb||rgb.length<3)return;
  const r=parseInt(rgb[0],16)/255;
  const g=parseInt(rgb[1],16)/255;
  const b=parseInt(rgb[2],16)/255;
  const max=Math.max(r,g,b),min=Math.min(r,g,b),delta=max-min;
  let hue=0;
  if(delta){
    if(max===r)hue=60*(((g-b)/delta)%6);
    else if(max===g)hue=60*((b-r)/delta+2);
    else hue=60*((r-g)/delta+4);
  }
  hue=(hue+360)%360;
  const saturation=max===0?0:delta/max;
  const angle=hue*Math.PI/180;
  const distance=saturation*radius*0.78;
  const px=centre+Math.cos(angle)*distance;
  const py=centre+Math.sin(angle)*distance;
  ctx.beginPath();
  ctx.arc(px,py,6,0,Math.PI*2);
  ctx.strokeStyle="#ffffff";
  ctx.lineWidth=3;
  ctx.stroke();
  ctx.beginPath();
  ctx.arc(px,py,8,0,Math.PI*2);
  ctx.strokeStyle="#101827";
  ctx.lineWidth=2;
  ctx.stroke();
}

function colourFromWheel(event){
  const canvas=$("colourCanvas");
  const rect=canvas.getBoundingClientRect();
  const scaleX=canvas.width/rect.width;
  const scaleY=canvas.height/rect.height;
  const x=(event.clientX-rect.left)*scaleX-canvas.width/2;
  const y=(event.clientY-rect.top)*scaleY-canvas.height/2;
  const radius=canvas.width/2-3;
  if(Math.sqrt(x*x+y*y)>radius)return;
  const pixel=$("colourCanvas").getContext("2d").getImageData(
    Math.round(x+canvas.width/2),
    Math.round(y+canvas.height/2),1,1
  ).data;
  const hex="#"+[pixel[0],pixel[1],pixel[2]]
    .map(v=>v.toString(16).padStart(2,"0")).join("");
  setWheelColour(hex);
}

function initColourWheel(){
  const canvas=$("colourCanvas");
  if(!canvas||canvas.dataset.ready)return;
  canvas.dataset.ready="1";
  drawColourWheel();
  canvas.addEventListener("pointerdown",event=>{
    event.preventDefault();
    canvas.setPointerCapture(event.pointerId);
    colourFromWheel(event);
  });
  canvas.addEventListener("pointermove",event=>{
    if(event.buttons||event.pointerType==="touch"){
      event.preventDefault();
      colourFromWheel(event);
    }
  });
  canvas.addEventListener("keydown",event=>{
    if(["ArrowUp","ArrowDown","ArrowLeft","ArrowRight"].includes(event.key)){
      event.preventDefault();
      const i=+$("wheelTarget").value;
      const colour=colours[i]||"#ff4b70";
      let hue=0;
      const rgb=colour.match(/[0-9a-f]{2}/gi);
      if(rgb&&rgb.length>=3){
        const r=parseInt(rgb[0],16)/255,g=parseInt(rgb[1],16)/255,b=parseInt(rgb[2],16)/255;
        const max=Math.max(r,g,b),min=Math.min(r,g,b),d=max-min;
        if(d){
          if(max===r)hue=60*(((g-b)/d)%6);
          else if(max===g)hue=60*((b-r)/d+2);
          else hue=60*((r-g)/d+4);
        }
      }
      hue=(hue+360)%360;
      const step=["ArrowRight","ArrowDown"].includes(event.key)?5:-5;
      hue=(hue+step+360)%360;
      const h=hue/60,c=1,x=c*(1-Math.abs(h%2-1));
      let rgb2;
      if(h<1)rgb2=[c,x,0];else if(h<2)rgb2=[x,c,0];
      else if(h<3)rgb2=[0,c,x];else if(h<4)rgb2=[0,x,c];
      else if(h<5)rgb2=[x,0,c];else rgb2=[c,0,x];
      setWheelColour("#"+rgb2.map(v=>Math.round(v*255).toString(16).padStart(2,"0")).join(""));
    }
  });
}

async function applyPattern(){let d=dev($("pdev").value||selected);if(!d)return alert("Add a device first.");let start=Math.max(0,+$("pstart").value||0),len=Math.max(1,+$("plen").value||1),col=colours.map(h=>[1,3,5].map(i=>parseInt(h.slice(i,i+2),16)));try{await api(d,"/json/state","POST",{seg:{id:0,start,len,col}});alert("Pattern sent to WLED.")}catch(e){alert("Could not apply pattern. Check the device connection.")}}
function savePattern(){let name=$("pname").value.trim();if(!name)return alert("Enter a pattern name.");patterns.push({name,colours:[...colours],start:+$("pstart").value||0,len:+$("plen").value||30});db.set("patterns",patterns);renderPatterns()}
function renderPatterns(){if(!$("colours"))return;renderColours();$("patternList").innerHTML=patterns.length?patterns.map((p,i)=>`<div class="row section"><span class="grow">${esc(p.name)}</span><button onclick="usePattern(${i})">Apply</button><button class="danger" onclick="patterns.splice(${i},1);db.set('patterns',patterns);renderPatterns()">×</button></div>`).join(""):'<div class="empty">No saved patterns yet.</div>'}
function usePattern(i){let p=patterns[i];colours=[...p.colours];$("pstart").value=p.start;$("plen").value=p.len;$("pname").value=p.name;renderColours();applyPattern()}
async function savePreset(){let d=dev($("prdev").value||selected);if(!d)return alert("Add a device first.");let slot=Math.max(1,Math.min(250,+$("prslot").value||1)),name=$("prname").value.trim()||"Glow preset";try{await api(d,"/json/state","POST",{psave:slot});presets.push({name,slot,device:d.name,url:d.url});db.set("presets",presets);renderPresets();alert("Preset command sent to WLED.")}catch(e){alert("Could not save preset. Check connection and WLED support.")}}
function renderPresets(){if(!$("presetList"))return;$("presetList").innerHTML=presets.length?presets.map((p,i)=>`<div class="row section"><span class="grow"><b>${esc(p.name)}</b><div class="sub">${esc(p.device)} · slot ${p.slot}</div></span><button onclick="loadPreset(${i})">Load</button><button class="danger" onclick="presets.splice(${i},1);db.set('presets',presets);renderPresets()">×</button></div>`).join(""):'<div class="empty">No presets saved on this phone.</div>'}
async function loadPreset(i){let p=presets[i],d=devices.find(x=>x.url===p.url)||dev();if(!d)return alert("Add the original device first.");try{await api(d,"/json/state","POST",{ps:p.slot});alert("Preset load command sent.")}catch(e){alert("Could not load preset.")}}
renderColours();render();
</script></body></html>
